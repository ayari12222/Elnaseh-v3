name: elnaseh_app
description: تطبيق الناصح للتواصل بدون إنترنت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. الواجهة والتصميم
  cupertino_icons: ^1.0.8

  # 2. الصوت والفلاش (SOS)
  audioplayers: ^6.0.0
  torch_light: ^1.1.0

  # 3. الإنترنت وقاعدة البيانات (النشر والتعليقات)
  supabase_flutter: ^2.5.0

  # 4. رفع الصور والفيديو (لوحة النشر)
  image_picker: ^1.1.2
  video_player: ^2.8.0

  # 5. البلوتوث (الرادار والاتصال القريب)
  flutter_blue_plus: ^1.31.0
  bluetooth_enable: ^1.0.0

  # 6. الواي فاي المباشر (لنقل الملفات الكبيرة بدون إنترنت)
  wifi_direct_plugin: ^0.1.7

  # 7. الخرائط (تعمل بدون إنترنت بعد التحميل)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  offline_tiles: ^0.5.8

  # 8. تحديد الموقع (لإرسال الإحداثيات في SOS)
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
